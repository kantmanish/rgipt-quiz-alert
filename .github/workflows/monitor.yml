name: RGIPT Quiz Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1-5'    # 08:00 AM IST (Mon-Fri)
    - cron: '15 8 * * 1-5'    # 01:45 PM IST (Mon-Fri)
    - cron: '0 14 * * 1-5'    # 07:30 PM IST (Mon-Fri)

concurrency:
  group: rgipt-quiz-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # 5h 45m (stops cleanly before GitHub's 6-hour hard kill)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Quiz Notifier
        env:
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u quiz_notifier.py
